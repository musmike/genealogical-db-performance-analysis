services:
  postgres:
    image: postgres:16.13
    container_name: postgres_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: benchmark_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../data_generator/output:/data:ro

    # Disable auto-vacuum to prevent background table cleanup from interfering with benchmarks
    # Disable all SQL logging and slow query logging
    # Disable logging collector

    command: >
      postgres
      -c autovacuum=off
      -c log_statement=none
      -c log_min_duration_statement=-1
      -c logging_collector=off

    networks:
      - benchmark_net

    cpus: 4
    mem_limit: 8g


  neo4j:
    image: neo4j:5.26.21-community
    container_name: neo4j_db
    restart: unless-stopped

    environment:
      # user/password.
      NEO4J_AUTH: neo4j/password

      NEO4J_PLUGINS: '["apoc"]'

      # Heap memory: initial and max set equal to avoid JVM heap resize overhead
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G

      # Page cache: main data cache used by Neo4j for nodes, relationships and properties
      # Set to 4G to fit within the 8G container memory limit alongside heap
      NEO4J_server_memory_pagecache_size: 4G

      # Disable query execution logging to eliminate log I/O overhead during benchmarks
      NEO4J_db_logs_query_enabled: "OFF"

      # Disable anonymous usage reporting to prevent outbound network calls
      NEO4J_dbms_usage__report_enabled: "false"

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # Mount CSV data directory as read-only for neo4j-admin import
      - ../data_generator/output:/import:ro

    networks:
      - benchmark_net

    cpus: 4
    mem_limit: 8g


networks:
  benchmark_net:
    driver: bridge


volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs: