services:
  postgres:
    image: postgres:17.9
    container_name: postgres_db
    restart: "no"

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: benchmark_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../data_generator/output:/data:ro


    command: >
      postgres
      -c log_statement=none
      -c log_min_duration_statement=-1
      -c logging_collector=off
      -c shared_buffers=2GB
      -c effective_cache_size=7GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c max_parallel_workers_per_gather=0
      -c max_parallel_workers=0
      -c random_page_cost=1.1

    # log_statement=none, log_min_duration_statement=-1, logging_collector=off:
    #   Disable all query logging and the logging collector to eliminate log I/O overhead during benchmarks.
    #
    # shared_buffers=2GB:
    #   Main PostgreSQL buffer cache. Set to ~25% of container memory (8GB) as recommended.
    #
    # effective_cache_size=7GB:
    #   Planner hint for total memory available for caching. Does not allocate memory—
    #   guides the planner to favor index scans over sequential scans.
    #
    # work_mem=64MB:
    #   Memory allocated per sort or hash operation for a single thread.
    #   With parallel workers disabled, peak usage will be 64MB per operation.
    #
    # maintenance_work_mem=1GB:
    #   Memory for maintenance operations (VACUUM, CREATE INDEX).
    #   Only used outside of benchmark execution.
    #
    # max_parallel_workers_per_gather=0, max_parallel_workers=0:
    #   Disable parallel query execution. Queries will run using a single thread only.
    #
    # random_page_cost=1.1:
    #   Reflects SSD storage characteristics. Default 4.0 assumes rotational disks.
    #   Setting 1.1 allows the planner to better choose index scans.

    networks:
      - benchmark_net

    cpuset: "0-3"
    mem_limit: 8g


  neo4j:
    image: neo4j:5.26.23-enterprise
    container_name: neo4j_db
    restart: "no"

    environment:
      # user/password
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_metrics_enabled: "false"
      NEO4J_server_cypher_parallel_worker__limit: "-100"

      # Heap initial and max set equal to avoid JVM heap resize overhead during execution.
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G

      # Page cache is the primary data cache for nodes, relationships, and properties.
      # Set to 4GB to fit within the 8GB container memory limit alongside the heap (2GB)
      # and JVM/OS overhead (~2GB).
      NEO4J_server_memory_pagecache_size: 4G

      # Disable query execution logging to eliminate log I/O overhead during benchmarks.
      NEO4J_db_logs_query_enabled: "OFF"

      # Disable anonymous usage reporting to prevent outbound network calls during benchmarks.
      NEO4J_dbms_usage__report_enabled: "false"

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ../../data_generator/output:/import:ro

    networks:
      - benchmark_net

    cpuset: "4-7"
    mem_limit: 8g


networks:
  benchmark_net:
    driver: bridge


volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs: